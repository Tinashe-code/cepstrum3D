<svg width="180" height="40" viewBox="0 0 180 40" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Layerline">
  <!-- Mark: three printed layers, fading upward (nod to the Cepstrum echo arc) -->
  <rect x="4" y="28" width="28" height="5" rx="2.5" fill="#090909"/>
  <rect x="7" y="20" width="22" height="5" rx="2.5" fill="#090909" fill-opacity="0.6"/>
  <rect x="10" y="12" width="16" height="5" rx="2.5" fill="#F97316"/>
  <text x="40" y="29" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="1.5" fill="#090909">LAYERLINE</text>
</svg>
